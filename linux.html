<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Server</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font:16px/1.5 system-ui,Segoe UI,sans-serif}
.card{background:#181b22;padding:32px;border-radius:16px;width:min(420px,calc(100vw - 32px));box-sizing:border-box;text-align:center}

p{color:#9aa3b2;margin:6px 0}code{background:#0003;padding:2px 6px;border-radius:6px;color:#e8eaf0}
</style></head><body>
<div class="card">
  <h1>Linux Server</h1>
  <p>MelodyFrost on Segfault</p>
  <a class="btn" href="segfault://open">Turn ON</a>
  <p>1. Password: <code>segfault</code></p>
  <p>2. Wait 60 seconds</p>
  <p>3. Ready when you see <code>#</code> — type your commands there.</p>
  <p style="margin-top:16px">Close the window to turn it off. Files in <code>/sec</code> and <code>/home</code> are kept.</p>
</div>
