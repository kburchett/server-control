<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Server</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font:16px/1.5 system-ui,Segoe UI,sans-serif}
.card{background:#181b22;padding:32px;border-radius:16px;width:min(420px,calc(100vw - 32px));box-sizing:border-box;text-align:center}
h1{margin:0 0 4px;font-size:22px}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px;background:#6b7280}
#state{font-size:26px;font-weight:700;margin:18px 0 4px}
#count{font-size:56px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums}
a.btn{display:block;margin:20px 0 14px;background:#22c55e;color:#fff;text-decoration:none;font-weight:700;font-size:20px;border-radius:12px;padding:16px 0}
a.btn.busy{opacity:.4;pointer-events:none}
p{color:#9aa3b2;margin:6px 0}code{background:#0003;padding:2px 6px;border-radius:6px;color:#e8eaf0}
</style></head><body>
<div class="card">
  <h1>Linux Server</h1>
  <p>MelodyFrost on Segfault</p>
  <div id="state"><span class="dot" id="dot"></span><span id="label">OFF</span></div>
  <div id="count"></div>
  <p id="hint">Click Turn ON — it opens in a new MobaXterm tab.</p>
  <a class="btn" id="btn" href="segfault://open">Turn ON</a>
  <p>Close the MobaXterm tab to turn it off. Files in <code>/sec</code> and <code>/home</code> are kept.</p>
</div>
<script>
// ponytail: countdown mirrors Segfault's fixed 60 s free-tier wait (+15 s for typing the password); the page can't see the SSH session itself.
const $ = id => document.getElementById(id);
$('btn').addEventListener('click', () => {
  let left = 75;
  $('btn').classList.add('busy');
  $('dot').style.background = '#f59e0b'; $('label').textContent = 'Starting…';
  $('hint').innerHTML = 'In MobaXterm type the password <code>segfault</code> and press Enter.';
  const t = setInterval(() => {
    $('count').textContent = left + 's';
    if (left-- <= 0) {
      clearInterval(t);
      $('count').textContent = '';
      $('dot').style.background = '#22c55e'; $('label').textContent = 'ON — ready';
      $('hint').innerHTML = 'Go to the MobaXterm tab. Ready when you see <code>#</code>.';
      $('btn').classList.remove('busy'); $('btn').textContent = 'Open another tab';
    }
  }, 1000);
});
</script>
</body></html>
